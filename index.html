<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Claude Hub</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121214;
      --border: #222226;
      --border-hover: #333338;
      --yellow: #facc15;
      --yellow-hover: #eab308;
      --yellow-dim: rgba(250, 204, 21, 0.08);
      --yellow-border: rgba(250, 204, 21, 0.25);
      --text: #f4f4f5;
      --text-muted: #71717a;
      --text-dim: #a1a1aa;
      --red: #ef4444;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 18px 14px;
      display: flex;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .container { width: 100%; max-width: 580px; }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .header-title h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-title h1 span { color: var(--yellow); }
    .header-actions { display: flex; gap: 6px; }

    /* Buttons */
    button {
      font-family: inherit;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .btn-top {
      background: #18181b;
      color: var(--text-dim);
      border-color: var(--border);
      padding: 7px 11px;
      font-size: 0.78rem;
    }
    .btn-top:hover { background: #27272a; color: #fff; }

    /* Grid & Cards */
    .grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      transition: border-color 0.2s ease;
    }
    .card.cooldown-active { border-color: var(--yellow-border); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .acc-name {
      font-weight: 600;
      font-size: 0.88rem;
      background: transparent;
      border: none;
      color: var(--text);
      outline: none;
      width: 140px;
    }
    .acc-name:focus { border-bottom: 1px solid var(--yellow); }

    .badge {
      font-size: 0.7rem;
      padding: 3px 7px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge-ready { background: var(--yellow-dim); color: var(--yellow); border: 1px solid var(--yellow-border); }
    .badge-cooldown { background: #1c1c20; color: var(--text-muted); border: 1px solid var(--border); }

    .timer-wrap {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .timer-display {
      font-size: 1.15rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #fff;
    }
    .timer-display.ready { color: var(--yellow); }

    .progress-bar-wrap {
      width: 100%;
      height: 3px;
      background: #1c1c20;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-bar {
      height: 100%;
      background: var(--yellow);
      width: 0%;
      transition: width 0.3s linear;
    }

    /* Card Actions Inline */
    .card-actions {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 6px;
    }
    .btn-drain {
      background: var(--yellow);
      color: #000;
      padding: 8px 10px;
      font-size: 0.78rem;
    }
    .btn-drain:hover { background: var(--yellow-hover); }
    .btn-drain.cooling {
      background: #18181b;
      color: var(--yellow);
      border: 1px solid var(--yellow-border);
    }

    .btn-action {
      background: #18181b;
      color: var(--text-dim);
      border: 1px solid var(--border);
      padding: 8px 10px;
      font-size: 0.78rem;
      text-decoration: none;
    }
    .btn-action:hover { background: #27272a; color: #fff; }
    .btn-delete { color: #71717a; }
    .btn-delete:hover { color: var(--red); border-color: rgba(239, 68, 68, 0.3); }

    /* Handover Box */
    .handover-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .templates {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .tmpl-btn {
      font-size: 0.72rem;
      padding: 5px 8px;
      border-radius: 4px;
      background: #18181b;
      color: var(--text-muted);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .tmpl-btn:hover { color: var(--yellow); border-color: var(--yellow-border); }

    textarea {
      width: 100%;
      height: 85px;
      background: #09090b;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      padding: 10px;
      font-family: inherit;
      font-size: 0.82rem;
      resize: vertical;
      line-height: 1.4;
      outline: none;
    }
    textarea:focus { border-color: var(--yellow-border); }

    .copy-btn {
      margin-top: 10px;
      width: 100%;
      background: #18181b;
      border: 1px solid var(--yellow-border);
      color: var(--yellow);
      font-weight: 700;
      padding: 10px;
      font-size: 0.82rem;
    }
    .copy-btn:hover { background: var(--yellow); color: #000; }

    /* Toast */
    #toast {
      visibility: hidden;
      min-width: 200px;
      background-color: #18181b;
      color: var(--yellow);
      border: 1px solid var(--yellow-border);
      text-align: center;
      border-radius: 6px;
      padding: 10px 14px;
      position: fixed;
      z-index: 1000;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(0,0,0,0.8);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    #toast.show { visibility: visible; opacity: 1; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-title">
        <h1>Claude <span>Hub</span></h1>
      </div>
      <div class="header-actions">
        <button class="btn-top" onclick="addAccount()">+ Слот</button>
        <button class="btn-top" onclick="requestNotificationPermission()">🔔</button>
      </div>
    </header>

    <div class="grid" id="accountsGrid"></div>

    <div class="handover-box">
      <div class="section-title">Перенос контекста</div>
      <div class="templates">
        <button class="tmpl-btn" onclick="applyTemplate('code')">Кодинг</button>
        <button class="tmpl-btn" onclick="applyTemplate('text')">Текст</button>
        <button class="tmpl-btn" onclick="applyTemplate('analysis')">Анализ</button>
      </div>
      <textarea id="context-input" placeholder="Вставьте технический бриф задачи..."></textarea>
      <button class="copy-btn" onclick="copyHandoverPrompt()">Скопировать бриф в буфер</button>
    </div>
  </div>

  <div id="toast">Скопировано</div>

  <script>
    const COOLDOWN_MS = 5 * 60 * 60 * 1000;
    let accounts = JSON.parse(localStorage.getItem('claude_hub_accounts')) || [
      { id: 'acc_1', name: 'Профиль #1', unlockTime: null },
      { id: 'acc_2', name: 'Профиль #2', unlockTime: null },
      { id: 'acc_3', name: 'Профиль #3', unlockTime: null }
    ];

    function saveState() {
      localStorage.setItem('claude_hub_accounts', JSON.stringify(accounts));
    }

    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.className = "show";
      setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2000);
    }

    function requestNotificationPermission() {
      if (!("Notification" in window)) {
        showToast("Уведомления не поддерживаются");
        return;
      }
      Notification.requestPermission().then(permission => {
        showToast(permission === "granted" ? "Уведомления включены" : "Уведомления отклонены");
      });
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 520;
        osc.type = "sine";
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    function renderAccounts() {
      const grid = document.getElementById('accountsGrid');
      grid.innerHTML = '';

      accounts.forEach((acc) => {
        const now = Date.now();
        const isCooldown = acc.unlockTime && acc.unlockTime > now;
        const diff = isCooldown ? acc.unlockTime - now : 0;
        
        const card = document.createElement('div');
        card.className = `card ${isCooldown ? 'cooldown-active' : ''}`;

        const h = Math.floor(diff / (1000 * 60 * 60));
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);
        const timeStr = isCooldown 
          ? `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` 
          : 'ГОТОВ К РАБОТЕ';

        let progressPct = 0;
        if (isCooldown) {
          const elapsed = COOLDOWN_MS - diff;
          progressPct = Math.min(100, Math.max(0, (elapsed / COOLDOWN_MS) * 100));
        }

        card.innerHTML = `
          <div class="card-top">
            <input type="text" class="acc-name" value="${acc.name}" onchange="updateName('${acc.id}', this.value)">
            <span class="badge ${isCooldown ? 'badge-cooldown' : 'badge-ready'}">
              ${isCooldown ? 'Кулдаун' : 'Готов'}
            </span>
          </div>
          <div class="timer-wrap">
            <div class="timer-display ${!isCooldown ? 'ready' : ''}">${timeStr}</div>
          </div>
          <div class="progress-bar-wrap">
            <div class="progress-bar" style="width: ${progressPct}%;"></div>
          </div>
          <div class="card-actions">
            <button class="btn-drain ${isCooldown ? 'cooling' : ''}" onclick="startCooldown('${acc.id}')">
              ${isCooldown ? 'Сбросить на 5ч' : 'Слить лимит (5ч)'}
            </button>
            <a href="https://claude.ai/new" target="_blank" class="btn-action">↗ Claude</a>
            <button class="btn-action" onclick="resetTimer('${acc.id}')" title="Сброс">↺</button>
            ${accounts.length > 1 ? `<button class="btn-action btn-delete" onclick="removeAccount('${acc.id}')">✕</button>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function updateName(id, newName) {
      const acc = accounts.find(a => a.id === id);
      if (acc) {
        acc.name = newName.trim() || 'Профиль';
        saveState();
      }
    }

    function startCooldown(id) {
      const acc = accounts.find(a => a.id === id);
      if (acc) {
        acc.unlockTime = Date.now() + COOLDOWN_MS;
        saveState();
        renderAccounts();
        showToast("Таймер запущен (5ч)");
      }
    }

    function resetTimer(id) {
      const acc = accounts.find(a => a.id === id);
      if (acc) {
        acc.unlockTime = null;
        saveState();
        renderAccounts();
        showToast("Сброшено");
      }
    }

    function addAccount() {
      const newId = 'acc_' + Date.now();
      accounts.push({
        id: newId,
        name: `Слот #${accounts.length + 1}`,
        unlockTime: null
      });
      saveState();
      renderAccounts();
    }

    function removeAccount(id) {
      accounts = accounts.filter(a => a.id !== id);
      saveState();
      renderAccounts();
    }

    function applyTemplate(type) {
      const area = document.getElementById('context-input');
      if (type === 'code') {
        area.value = `[СТЕК]: \n[ЗАДАЧА]: \n[ЧТО СДЕЛАНО]: \n[СЛЕДУЮЩИЙ ШАГ]: \n[КОД]:\n`;
      } else if (type === 'text') {
        area.value = `[ЦЕЛЬ]: \n[ТОН]: \n[ТЕЗИСЫ]: \n[ТЕКСТ]:\n`;
      } else if (type === 'analysis') {
        area.value = `[ОБЪЕКТ]: \n[ДАННЫЕ]: \n[ВОПРОС]:\n`;
      }
      area.focus();
    }

    function copyHandoverPrompt() {
      const rawText = document.getElementById('context-input').value.trim();
      if (!rawText) {
        showToast("Введите текст брифа");
        return;
      }
      const finalPrompt = `Мы продолжаем непрерывную сессию. Контекст из предыдущего чата:\n\n---\n${rawText}\n---\n\nИзучи бриф, подтверди готовность одним предложением и переходи к выполнению.`;
      navigator.clipboard.writeText(finalPrompt).then(() => {
        showToast("Бриф скопирован!");
      });
    }

    setInterval(() => {
      let stateChanged = false;
      const now = Date.now();
      accounts.forEach(acc => {
        if (acc.unlockTime && acc.unlockTime <= now) {
          acc.unlockTime = null;
          stateChanged = true;
          playBeep();
          if (Notification.permission === "granted") {
            new Notification("Claude Hub", { body: `${acc.name} готов к работе!` });
          }
        }
      });
      if (stateChanged) saveState();
      renderAccounts();
    }, 1000);

    renderAccounts();
  </script>
</body>
</html>
